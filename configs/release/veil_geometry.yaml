# Standalone training recipe. The released coverage checkpoint used staged training.
model: rapc_net
run_name: veil_geometry
require_fresh_run: true
sample_seed: 0
input_points: 2048
output_points: 16384
epochs: 50
batch_size: 2
learning_rate: 0.0003
amp: false
gradient_clip: 5.0
bbox_margin: 0.0
uncertainty_moves_points: false
use_spatial_transformer: true
input_frame_normalization: true
robust_input_geometry: true
two_stage_folding: true
geometry_queries: true
query_position_conditioning: true
spatial_tokens: 128
spatial_patches: 256
loss:
  lambda_cd: 1.8
  lambda_coarse: 0.5
  lambda_missing: 1.5
  lambda_surface: 0.5
  lambda_soft_fscore: 0.2
  lambda_preserve: 0.2
  lambda_risk: 0.015
  lambda_uncertainty: 0.005
  lambda_uniform: 0.0
  lambda_balance: 0.005
  missing_threshold: 0.03
  missing_on_completed: true
  relative_geometry_loss: true
