[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veil-net"
version = "0.2.0"
description = "Geometry-conditioned surface completion for occluded 3D objects."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["point-cloud", "3d", "completion", "pytorch", "veil-net"]
dependencies = [
  "numpy>=1.24",
  "torch>=2.3",
  "pyyaml>=6",
  "tqdm>=4.65",
  "safetensors>=0.4",
]

[project.optional-dependencies]
hub = ["huggingface-hub>=0.26"]
dev = ["pytest>=8", "build>=1", "ruff>=0.9"]

[project.urls]
Repository = "https://github.com/HaeinSeo/VEIL-Net"
Documentation = "https://github.com/HaeinSeo/VEIL-Net#readme"
Issues = "https://github.com/HaeinSeo/VEIL-Net/issues"

[project.scripts]
veil = "veil_net.cli:main"

[tool.setuptools.packages.find]
include = ["veil_net*"]
exclude = ["*.tests*"]

[tool.setuptools.package-data]
veil_net = ["model_card.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100
include = ["veil_net/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
